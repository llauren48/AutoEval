server {
 listen 443 ssl;
 server_name _;
 ssl_certificate /etc/nginx/tls/server.crt;
 ssl_certificate_key /etc/nginx/tls/server.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 auth_basic "AutoEval internal trial";
 auth_basic_user_file /etc/nginx/htpasswd;
 client_max_body_size 20m;
 location /api/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
 location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
