name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Ruff and pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AE_DATABASE_URL: postgresql+asyncpg://autoeval:ci-only@127.0.0.1:5432/autoeval
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: autoeval
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: autoeval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoeval -d autoeval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - run: uv sync --locked --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync alembic upgrade head
      - run: uv run --no-sync pytest -q

  frontend:
    name: Frontend (boundaries and build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:boundaries
      - run: npm run build
