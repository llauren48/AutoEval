name: autoeval-demo
x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile
  environment: &environment
    AE_DATABASE_URL: postgresql+asyncpg://autoeval:${AE_DB_PASSWORD:?Set AE_DB_PASSWORD}@postgres:5432/autoeval
    AE_TEMPORAL_ADDRESS: temporal:7233
    AE_S3_ENDPOINT: http://storage:9000
    AE_S3_ACCESS_KEY: ${AE_S3_ACCESS_KEY:?Set AE_S3_ACCESS_KEY}
    AE_S3_SECRET_KEY: ${AE_S3_SECRET_KEY:?Set AE_S3_SECRET_KEY}
  depends_on:
    postgres:
      condition: service_healthy
    temporal:
      condition: service_started
  restart: on-failure
services:
  executor:
    image: python:3.12-slim
    command: ["python", "-c", "import time; time.sleep(31536000)"]
    labels:
      autoeval.role: executor
    working_dir: /work
    profiles: ["executor"]
    volumes: ["executor-work:/work"]
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: autoeval
      POSTGRES_USER: autoeval
      POSTGRES_PASSWORD: ${AE_DB_PASSWORD:?Set AE_DB_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoeval -d autoeval"]
      interval: 5s
      timeout: 3s
      retries: 20
  temporal:
    image: temporalio/temporal:1.4.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: ["temporal:/data"]
    depends_on:
      temporal-data-init:
        condition: service_completed_successfully
  temporal-data-init:
    image: postgres:16.6
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 1000:1000 /data"]
    volumes: ["temporal:/data"]
    restart: "no"
  storage:
    # Local API simulation only. Not durable evidence storage or production S3.
    image: motoserver/moto:5.1.22
    environment:
      MOTO_PORT: "9000"
    ports: ["127.0.0.1:9000:9000"]
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    profiles: ["tools"]
  dispatcher:
    <<: *backend
    command: ["python", "-m", "autoeval.dispatcher"]
    profiles: ["workers"]
  workflow-worker:
    <<: *backend
    command: ["python", "-m", "autoeval.worker", "workflow"]
    profiles: ["workers"]
  io-worker:
    <<: *backend
    command: ["python", "-m", "autoeval.worker", "io"]
    profiles: ["workers"]
  result-worker:
    <<: *backend
    command: ["python", "-m", "autoeval.worker", "result"]
    profiles: ["workers"]
  monitored-worker:
    <<: *backend
    command: ["python", "-m", "autoeval.worker", "monitored"]
    profiles: ["workers"]
  planning-worker:
    <<: *backend
    command: ["python", "-m", "autoeval.planning_worker"]
    profiles: ["workers"]
  planning-execution-worker:
    <<: *backend
    command: ["python", "-m", "autoeval.worker", "planning-execution"]
    profiles: ["workers"]
  reconciler:
    <<: *backend
    command: ["python", "-m", "autoeval.reconciler"]
    profiles: ["workers"]
volumes:
  executor-work:
  database:
  temporal:
